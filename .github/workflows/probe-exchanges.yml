# TEMPORARY diagnostic. Delete once a working funding/open-interest source is
# chosen.
#
# Binance answers 451 and Bybit answers 403 from GitHub's IP ranges, while both
# answer 200 from a home connection. Guessing the next exchange would repeat the
# mistake, so this asks the runner itself which public futures APIs it can
# actually reach.
name: probe-exchanges

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public futures endpoints from this runner
        run: |
          probe() {
            name="$1"; url="$2"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || echo "000")
            head=$(head -c 110 /tmp/body | tr -d '\n')
            printf '%-34s %s  %s\n' "$name" "$code" "$head"
          }

          echo "=== FUNDING RATE ==="
          probe "binance.funding"  "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2"
          probe "bybit.funding"    "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"
          probe "okx.funding"      "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2"
          probe "deribit.funding"  "https://www.deribit.com/api/v2/public/get_funding_rate_history?instrument_name=BTC-PERPETUAL&start_timestamp=1784000000000&end_timestamp=1785000000000"
          probe "kraken.funding"   "https://futures.kraken.com/derivatives/api/v4/historicalfundingrates?symbol=PF_XBTUSD"
          probe "gate.funding"     "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=BTC_USDT&limit=2"
          probe "kucoin.funding"   "https://api-futures.kucoin.com/api/v1/contract/funding-rates?symbol=XBTUSDTM&from=1784000000000&to=1785000000000"
          probe "bitget.funding"   "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=usdt-futures"
          probe "mexc.funding"     "https://contract.mexc.com/api/v1/contract/funding_rate/history?symbol=BTC_USDT&page_size=2"
          probe "coinbase.funding" "https://api.international.coinbase.com/api/v1/instruments/BTC-PERP/funding"

          echo
          echo "=== OPEN INTEREST ==="
          probe "binance.oi"       "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1d&limit=2"
          probe "bybit.oi"         "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1d&limit=2"
          probe "okx.oi"           "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1D"
          probe "deribit.oi"       "https://www.deribit.com/api/v2/public/get_book_summary_by_instrument?instrument_name=BTC-PERPETUAL"
          probe "kraken.oi"        "https://futures.kraken.com/derivatives/api/v3/tickers"
          probe "gate.oi"          "https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=BTC_USDT&limit=2"

          echo
          echo "=== SPOT PRICE (what the engine already relies on) ==="
          probe "coingecko.ping"   "https://api.coingecko.com/api/v3/ping"
          probe "yahoo.chart"      "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d"
