# Runs the daily signal scan in the cloud, so it no longer depends on a Mac
# being awake at 9am. This is "git scraping": a scheduled job runs the engine
# and commits the resulting signal log back to the repo, which becomes the
# persistent store. The append-only log survives because each run checks out
# the previous commit, appends today's signals, and pushes.
#
# Free on a public repo (unlimited Actions minutes), and the daily commit keeps
# the schedule from being auto-disabled for inactivity.
name: daily-signals

on:
  schedule:
    # 22:00 UTC daily — after the US market close (20:00-21:00 UTC), so each day's
    # US daily bar is final when the scan runs and the signal is dated the same
    # day as the market it reflects. GitHub cron is always UTC; to move it to your
    # local morning, convert and edit this line (22:00 UTC = 17:00 US-Central /
    # 03:30 India). Scheduled runs are best-effort: GitHub can delay them 15 min
    # to a few hours under load and very occasionally skip one. For daily bars,
    # fine — and one run per day is deliberate (see the note at the bottom).
    - cron: "0 22 * * *"
  workflow_dispatch: {} # also lets you run it by hand from the Actions tab

# The job commits back to the repo, so it needs write access to contents.
permissions:
  contents: write

# Never let two daily runs overlap and race on the same signal log.
concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the engine
        run: pip install -e .

      - name: Refresh context caches (news, on-chain, fundamentals)
        # Context is optional and best-effort — a failed feed must never block
        # the scan, so this step is allowed to fail and the job continues. It is
        # NOT allowed to fail silently: `--strict` exits non-zero when a whole
        # data kind came back with zero items, and the "Fail if the scrape
        # degraded" step at the end turns that into a red build.
        #
        # That combination is the fix for a real month-long outage. Binance
        # answers HTTP 451 to every request from a datacenter IP, so the runner
        # collected no futures positioning data at all — while this job reported
        # success every single day, because a dead feed raises nothing and the
        # health record was an aggregate that one live feed kept green.
        #
        # Keys are OPTIONAL: every one below degrades gracefully when its secret
        # is unset (the engine gates on a truthy value, so an absent secret is
        # an empty string is "off"). Add a key at repo Settings -> Secrets and
        # variables -> Actions and it activates here automatically.
        id: ingest
        continue-on-error: true
        run: python -m alpha_engine.cli.main ingest BTC ETH SOL AAPL MSFT GOOGL NVDA --strict
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }} # higher crypto limits
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }} # company news
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }} # fundamentals
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }} # crypto on-chain
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }} # enables SEC EDGAR news

      - name: Batch scan (records signals, writes the daily report)
        # FRED macro refreshes inline during an equity scan, so its key belongs
        # here, not on ingest. CoinGecko is used for price fetches in both steps.
        run: python -m alpha_engine.cli.main batch --output data/reports/daily.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} # US macro context on equity signals
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Source health (informational — never blocks the commit)
        # Informational only in CI, and deliberately so: the runner starts with
        # an empty data/ every time, so health has no history here and cannot
        # detect the multi-day decay it is designed for. That job belongs to a
        # long-lived install. The per-run signal is `ingest --strict` above.
        run: python -m alpha_engine.cli.main health || true

      - name: Commit the day's signals and report back to the repo
        # Runs even when the scrape degraded. Partial data is still the day's
        # record, and losing it would punish the operator twice for one broken
        # feed. The build still goes red at the next step.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whichever artefacts exist. `if: always()` means this step also
          # runs when the batch scan crashed before writing its report, and a
          # bare `git add` on a missing path aborts the whole step.
          for artefact in data/signals/signals.jsonl data/reports/daily.json; do
            if [ -f "$artefact" ]; then git add "$artefact"; fi
          done
          if git diff --cached --quiet; then
            echo "no new signals to commit"
          else
            # [skip ci] so this data commit doesn't trigger the test workflow.
            git commit -m "data: daily signals $(date -u +%Y-%m-%d) [skip ci]"
            # The scheduled run races nothing, but a manual dispatch can land
            # while another commit is being pushed. Rebase and retry rather than
            # losing the day's data to a non-fast-forward.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              # No ref is named here on purpose: actions/checkout sets the
              # branch to track its own origin/<branch>, so a bare pull follows
              # whichever ref this run was dispatched on. Hardcoding main would
              # rebase a branch run onto the wrong history.
              echo "push rejected (attempt $attempt); rebasing on the tracked upstream"
              git pull --rebase --autostash || exit 1
            done
            echo "::error::could not push the day's signals after 3 attempts"
            exit 1
          fi

      - name: Fail if the scrape degraded
        # The last line of defence against a green build with no data. Without
        # this the whole point of --strict is lost: the step above is
        # continue-on-error, so its failure would otherwise vanish.
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Context ingestion reported a data kind with zero items."
          echo "The signals for today were still committed, but at least one"
          echo "source produced nothing. Check the 'Refresh context caches' step"
          echo "for lines starting with EMPTY or WARNING."
          exit 1
